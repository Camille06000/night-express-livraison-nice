<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Admin — Night Express</title>
<style>
  :root{
    --bg:#070509; --panel:#0f0d14; --panel2:#151220; --line:#241f30;
    --text:#f3ecdf; --muted:#8a8296; --gold:#d4af37; --gold2:#f2d472;
    --ok:#3dd68c; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Inter,Arial,sans-serif}
  a{color:var(--gold2)}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--gold);color:#1a1208;font-weight:600}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.danger{background:#2a1417;color:#ffb4b4;border:1px solid #5a2228}
  button.sm{padding:5px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
  textarea{min-height:90px;resize:vertical;font:13.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
  .wrap{max-width:1320px;margin:0 auto;padding:18px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  h1{font:600 22px/1 "Playfair Display",Georgia,serif;margin:0;letter-spacing:.3px}
  h1 span{color:var(--gold);font-style:italic}
  h3{margin:0 0 12px;font-size:17px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .toolbar .grow{flex:1;min-width:220px}
  .tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
  .tabs button{background:transparent;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;padding:10px 16px;font-weight:500}
  .tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
  .login{max-width:380px;margin:8vh auto;padding:28px}
  .msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px}
  .msg.err{background:#2a1417;color:#ffb4b4;border:1px solid #5a2228}
  .msg.ok{background:#0f2a20;color:#b9f2d3;border:1px solid #1f5a42}
  .msg.warn{background:#2a2210;color:#ffd99b;border:1px solid #5a4820}
  table{width:100%;border-collapse:separate;border-spacing:0}
  thead th{position:sticky;top:0;background:var(--panel2);z-index:1;text-align:left;font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.4px;text-transform:uppercase;padding:10px;border-bottom:1px solid var(--line)}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#100d18}
  tbody tr.dirty{background:#1b160a}
  tbody tr.inactive td:not(:last-child){opacity:.45}
  .name{font-weight:600}
  .cat{color:var(--muted);font-size:12.5px}
  .img{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#000;border:1px solid var(--line)}
  .w-price{width:95px}
  .w-slug{width:160px}
  .center{text-align:center}
  .right{text-align:right}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .flex{display:flex;gap:8px;align-items:center}
  .hide{display:none}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dot.on{background:var(--ok)}
  .dot.off{background:#555}
  .footer{color:var(--muted);font-size:12px;margin-top:14px;text-align:center}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:780px;width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stack > * + *{margin-top:6px}
  @media(max-width:720px){
    .w-slug{display:none}
    .img{width:34px;height:34px}
    .grid2,.grid3{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="loginView" class="wrap">
  <div class="card login">
    <h1>Night <span>Express</span></h1>
    <div class="pill" style="margin-top:10px">Administration</div>
    <div id="loginMsg"></div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="toi@exemple.com" />
    <label>Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div style="margin-top:16px;display:flex;gap:8px">
      <button id="btnLogin" style="flex:1">Se connecter</button>
      <button id="btnReset" class="ghost" title="Recevoir un lien de reset">Oubli ?</button>
    </div>
    <div class="footer">Accès réservé.</div>
  </div>
</div>

<div id="appView" class="wrap hide">
  <header>
    <div class="flex">
      <h1>Night <span>Express</span></h1>
      <span class="pill">Admin</span>
      <span id="userEmail" class="pill"></span>
    </div>
    <div class="flex">
      <button id="btnRefresh" class="ghost">↻ Recharger</button>
      <button id="btnLogout" class="ghost">Déconnexion</button>
    </div>
  </header>

  <div class="tabs">
    <button data-tab="products" class="active">Produits</button>
    <button data-tab="blog">Blog</button>
    <button data-tab="categories">Catégories</button>
  </div>

  <div id="appMsg"></div>

  <!-- ======= PRODUCTS TAB ======= -->
  <div id="tab-products">
    <div class="card">
      <div class="toolbar">
        <div class="grow"><input id="search" type="search" placeholder="Rechercher un produit (nom, slug)…" /></div>
        <select id="filterCat" style="max-width:220px"><option value="">Toutes catégories</option></select>
        <select id="filterActive" style="max-width:160px">
          <option value="all">Tous</option>
          <option value="active" selected>Actifs seulement</option>
          <option value="inactive">Inactifs</option>
        </select>
        <span id="counter" class="pill">—</span>
        <button id="btnNewProduct">+ Nouveau produit</button>
      </div>

      <div style="overflow:auto;max-height:72vh">
        <table>
          <thead>
            <tr>
              <th style="width:56px"></th>
              <th>Produit</th>
              <th>Catégorie</th>
              <th class="right">Prix (€)</th>
              <th class="right">Promo (€)</th>
              <th class="center">Actif</th>
              <th class="right" style="width:130px">Action</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ======= BLOG TAB ======= -->
  <div id="tab-blog" class="hide">
    <div class="card">
      <div class="toolbar">
        <div class="grow"><input id="searchBlog" type="search" placeholder="Rechercher un article…" /></div>
        <span id="counterBlog" class="pill">—</span>
        <button id="btnNewPost">+ Nouvel article</button>
      </div>

      <div style="overflow:auto;max-height:72vh">
        <table>
          <thead>
            <tr>
              <th>Titre</th>
              <th>Slug</th>
              <th class="center">Publié</th>
              <th class="right">Date</th>
              <th class="right" style="width:150px">Action</th>
            </tr>
          </thead>
          <tbody id="rowsBlog"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ======= CATEGORIES TAB ======= -->
  <div id="tab-categories" class="hide">
    <div class="card">
      <div class="toolbar">
        <span id="counterCat" class="pill">—</span>
        <button id="btnNewCat">+ Nouvelle catégorie</button>
      </div>
      <div style="overflow:auto;max-height:72vh">
        <table>
          <thead>
            <tr><th>Nom</th><th>Slug</th><th class="right">Action</th></tr>
          </thead>
          <tbody id="rowsCat"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer">Base : <span id="dbUrl" class="mono"></span> · Modifs live — pas de redéploiement nécessaire.</div>
</div>

<!-- ======= MODAL (shared) ======= -->
<div id="modal" class="modal-bg hide">
  <div class="modal">
    <header style="margin-bottom:12px"><h3 id="modalTitle">Nouveau</h3></header>
    <div id="modalBody"></div>
    <div id="modalMsg"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button id="modalCancel" class="ghost">Annuler</button>
      <button id="modalDelete" class="danger hide">Supprimer</button>
      <button id="modalSave">Enregistrer</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const SUPABASE_URL  = "https://ifhhfvphrhznislokzxd.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmaGhmdnBocmh6bmlzbG9renhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk3NDA5MDgsImV4cCI6MjA2NTMxNjkwOH0.3ctYoFNtg5hLGhj4VQABnvLMEfHXm_yzDqMC4KpQLlI";

const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: "ne-admin-auth" }
});

const $ = id => document.getElementById(id);
$("dbUrl").textContent = SUPABASE_URL.replace("https://","");

let state = { products: [], categories: [], posts: [], session: null, tab: "products" };

function msg(target, text, kind="err"){
  target.innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : "";
}
function fmtPrice(v){ return v==null ? "" : Number(v).toFixed(2); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function slugify(s){
  return (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,80);
}

/* ---------- AUTH ---------- */
async function loadSession(){
  const { data } = await sb.auth.getSession();
  state.session = data.session || null;
  if (state.session) showApp(); else showLogin();
}
function showLogin(){ $("appView").classList.add("hide"); $("loginView").classList.remove("hide"); }
function showApp(){
  $("loginView").classList.add("hide"); $("appView").classList.remove("hide");
  $("userEmail").textContent = state.session?.user?.email || "";
  loadAll();
}

$("btnLogin").addEventListener("click", async ()=>{
  msg($("loginMsg"),"","");
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password){ msg($("loginMsg"),"Email et mot de passe requis.","err"); return; }
  $("btnLogin").disabled = true; $("btnLogin").textContent = "…";
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  $("btnLogin").disabled = false; $("btnLogin").textContent = "Se connecter";
  if (error){ msg($("loginMsg"), error.message, "err"); return; }
  state.session = data.session; showApp();
});
$("btnReset").addEventListener("click", async ()=>{
  const email = $("email").value.trim();
  if (!email){ msg($("loginMsg"),"Entre ton email d'abord.","warn"); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  msg($("loginMsg"), error ? error.message : "Email envoyé. Vérifie ta boîte mail.", error?"err":"ok");
});
$("btnLogout").addEventListener("click", async ()=>{ await sb.auth.signOut(); state.session=null; showLogin(); });
$("btnRefresh").addEventListener("click", loadAll);
sb.auth.onAuthStateChange((_e, session)=>{ state.session = session; if(!session) showLogin(); });

/* ---------- TABS ---------- */
document.querySelectorAll(".tabs button").forEach(b=>{
  b.addEventListener("click", ()=>{
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active", x===b));
    ["products","blog","categories"].forEach(t => $("tab-"+t).classList.toggle("hide", t!==state.tab));
  });
});

/* ---------- LOAD ALL ---------- */
async function loadAll(){
  msg($("appMsg"),"Chargement…","warn");
  const [p,c,b] = await Promise.all([
    sb.from("products").select("id,name,slug,price,price_promo,is_active,category_id,image_url,short_description,description,stock_quantity,sku,alcohol_percentage,origin_country,meta_title,meta_description,tags,is_featured").order("name"),
    sb.from("categories").select("*").order("name"),
    sb.from("blog_posts").select("id,title,slug,excerpt,content,featured_image,is_published,published_at,meta_title,meta_description,tags").order("published_at",{ascending:false})
  ]);
  for (const [name,r] of [["produits",p],["catégories",c],["blog",b]]){
    if (r.error){ msg($("appMsg"),`Erreur ${name} : ${r.error.message}`,"err"); return; }
  }
  state.products = p.data || [];
  state.categories = c.data || [];
  state.posts = b.data || [];
  const catMap = Object.fromEntries(state.categories.map(x=>[x.id,x.name]));
  state.products.forEach(x=> x._cat = catMap[x.category_id] || "—");

  $("filterCat").innerHTML = '<option value="">Toutes catégories</option>' +
    state.categories.map(x=>`<option value="${x.id}">${escapeHtml(x.name)}</option>`).join("");

  msg($("appMsg"),"","");
  renderProducts(); renderBlog(); renderCategories();
}

/* ---------- PRODUCTS ---------- */
function renderProducts(){
  const q = $("search").value.trim().toLowerCase();
  const cat = $("filterCat").value;
  const act = $("filterActive").value;
  const list = state.products.filter(p=>{
    if (q && !((p.name||"").toLowerCase().includes(q) || (p.slug||"").toLowerCase().includes(q))) return false;
    if (cat && p.category_id !== cat) return false;
    if (act==="active" && !p.is_active) return false;
    if (act==="inactive" && p.is_active) return false;
    return true;
  });
  $("counter").textContent = `${list.length} / ${state.products.length} produits`;

  $("rows").innerHTML = list.map(p=>`
    <tr data-id="${p.id}" class="${p.is_active?"":"inactive"}">
      <td>${p.image_url?`<img class="img" src="${escapeHtml(p.image_url)}" loading="lazy" onerror="this.style.visibility='hidden'">`:'<div class="img"></div>'}</td>
      <td>
        <div class="name">${escapeHtml(p.name||"")}</div>
        <div class="cat mono w-slug">${escapeHtml(p.slug||"")}</div>
      </td>
      <td class="cat">${escapeHtml(p._cat)}</td>
      <td class="right"><input class="w-price price" type="number" step="0.01" min="0" value="${fmtPrice(p.price)}"></td>
      <td class="right"><input class="w-price promo" type="number" step="0.01" min="0" value="${fmtPrice(p.price_promo)}"></td>
      <td class="center"><input type="checkbox" class="active" ${p.is_active?"checked":""}></td>
      <td class="right flex" style="justify-content:flex-end">
        <button class="save sm" disabled>Sauver</button>
        <button class="edit sm ghost">Détails</button>
      </td>
    </tr>
  `).join("");

  $("rows").querySelectorAll("tr").forEach(tr=>{
    const id = tr.dataset.id;
    const btn = tr.querySelector(".save");
    const priceI = tr.querySelector(".price");
    const promoI = tr.querySelector(".promo");
    const activeI = tr.querySelector(".active");
    const mark = ()=>{ tr.classList.add("dirty"); btn.disabled=false; };
    priceI.addEventListener("input", mark);
    promoI.addEventListener("input", mark);
    activeI.addEventListener("change", mark);
    priceI.addEventListener("keydown", e=>{ if(e.key==="Enter") btn.click(); });
    promoI.addEventListener("keydown", e=>{ if(e.key==="Enter") btn.click(); });
    btn.addEventListener("click", ()=>saveProductRow(id, priceI, promoI, activeI, tr, btn));
    tr.querySelector(".edit").addEventListener("click", ()=>editProduct(id));
  });
}
[ "search", "filterCat", "filterActive" ].forEach(id => $(id).addEventListener("input", renderProducts));

async function saveProductRow(id, priceI, promoI, activeI, tr, btn){
  btn.disabled=true; btn.textContent="…";
  const patch = {
    price: priceI.value===""? null : Number(priceI.value),
    price_promo: promoI.value===""? null : Number(promoI.value),
    is_active: !!activeI.checked
  };
  const { data, error } = await sb.from("products").update(patch).eq("id",id).select("id");
  if (error){ msg($("appMsg"),`Erreur : ${error.message}`,"err"); btn.disabled=false; btn.textContent="Sauver"; return; }
  if (!data || !data.length){ msg($("appMsg"),"Refus (RLS). Vérifie les policies.","err"); btn.disabled=false; btn.textContent="Sauver"; return; }
  const p = state.products.find(x=>x.id===id); Object.assign(p, patch);
  tr.classList.remove("dirty");
  tr.classList.toggle("inactive", !p.is_active);
  btn.textContent="✓"; msg($("appMsg"),"Produit mis à jour.","ok");
  setTimeout(()=>{ btn.textContent="Sauver"; btn.disabled=true; msg($("appMsg"),"",""); }, 1400);
}

function productForm(p={}){
  const catOptions = state.categories.map(c=>`<option value="${c.id}" ${c.id===p.category_id?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
  return `
    <div class="stack">
      <div class="grid2">
        <div><label>Nom *</label><input name="name" value="${escapeHtml(p.name||"")}" required></div>
        <div><label>Slug (auto si vide)</label><input name="slug" value="${escapeHtml(p.slug||"")}" placeholder="ex: champagne-paul-menand"></div>
      </div>
      <div class="grid3">
        <div><label>Prix (€) *</label><input name="price" type="number" step="0.01" min="0" value="${fmtPrice(p.price)}" required></div>
        <div><label>Prix promo (€)</label><input name="price_promo" type="number" step="0.01" min="0" value="${fmtPrice(p.price_promo)}"></div>
        <div><label>Stock</label><input name="stock_quantity" type="number" min="0" value="${p.stock_quantity??""}"></div>
      </div>
      <div class="grid2">
        <div><label>Catégorie</label><select name="category_id"><option value="">—</option>${catOptions}</select></div>
        <div><label>URL image</label><input name="image_url" value="${escapeHtml(p.image_url||"")}" placeholder="/lovable-uploads/xxx.png"></div>
      </div>
      <div><label>Description courte</label><input name="short_description" value="${escapeHtml(p.short_description||"")}"></div>
      <div><label>Description complète</label><textarea name="description">${escapeHtml(p.description||"")}</textarea></div>
      <div class="grid2">
        <div><label>Meta title (SEO)</label><input name="meta_title" value="${escapeHtml(p.meta_title||"")}" maxlength="70"></div>
        <div><label>Meta description (SEO)</label><input name="meta_description" value="${escapeHtml(p.meta_description||"")}" maxlength="160"></div>
      </div>
      <div class="grid3">
        <div><label>SKU</label><input name="sku" value="${escapeHtml(p.sku||"")}"></div>
        <div><label>% Alcool</label><input name="alcohol_percentage" type="number" step="0.1" min="0" max="100" value="${p.alcohol_percentage??""}"></div>
        <div><label>Origine</label><input name="origin_country" value="${escapeHtml(p.origin_country||"")}"></div>
      </div>
      <div><label>Tags (séparés par virgules)</label><input name="tags" value="${escapeHtml((p.tags||[]).join(", "))}"></div>
      <div class="flex" style="margin-top:10px">
        <label style="margin:0;text-transform:none;color:var(--text);font-size:14px"><input type="checkbox" name="is_active" ${p.is_active!==false?"checked":""} style="width:auto;margin-right:6px">Actif (visible sur le site)</label>
        <label style="margin:0;text-transform:none;color:var(--text);font-size:14px"><input type="checkbox" name="is_featured" ${p.is_featured?"checked":""} style="width:auto;margin-right:6px">Mis en avant</label>
      </div>
    </div>`;
}

function readForm(kind){
  const body = $("modalBody");
  const f = {};
  body.querySelectorAll("input,select,textarea").forEach(el=>{
    const n = el.name; if(!n) return;
    if (el.type==="checkbox") f[n] = el.checked;
    else if (el.type==="number") f[n] = el.value===""? null : Number(el.value);
    else f[n] = el.value;
  });
  if (kind==="product"){
    if (!f.slug && f.name) f.slug = slugify(f.name);
    if (f.tags!==undefined) f.tags = String(f.tags).split(",").map(s=>s.trim()).filter(Boolean);
  }
  if (kind==="post"){
    if (!f.slug && f.title) f.slug = slugify(f.title);
    if (f.tags!==undefined) f.tags = String(f.tags).split(",").map(s=>s.trim()).filter(Boolean);
    if (f.is_published && !f.published_at) f.published_at = new Date().toISOString();
  }
  return f;
}

let currentEdit = null;
function openModal(title, html, onSave, onDelete){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  msg($("modalMsg"),"","");
  $("modalDelete").classList.toggle("hide", !onDelete);
  $("modal").classList.remove("hide");
  $("modalSave").onclick = onSave;
  $("modalDelete").onclick = onDelete || null;
}
$("modalCancel").onclick = ()=>{ $("modal").classList.add("hide"); currentEdit=null; };

$("btnNewProduct").addEventListener("click", ()=>{
  currentEdit = { kind:"product", id:null };
  openModal("Nouveau produit", productForm({is_active:true}), saveProduct);
});
function editProduct(id){
  const p = state.products.find(x=>x.id===id); if(!p) return;
  currentEdit = { kind:"product", id };
  openModal(`Modifier : ${p.name}`, productForm(p), saveProduct, ()=>deleteProduct(id));
}
async function saveProduct(){
  const f = readForm("product");
  if (!f.name || f.price==null){ msg($("modalMsg"),"Nom et prix sont requis.","err"); return; }
  $("modalSave").disabled = true; $("modalSave").textContent = "…";
  let res;
  if (currentEdit.id){
    res = await sb.from("products").update(f).eq("id", currentEdit.id).select();
  } else {
    res = await sb.from("products").insert(f).select();
  }
  $("modalSave").disabled = false; $("modalSave").textContent = "Enregistrer";
  if (res.error){ msg($("modalMsg"), res.error.message, "err"); return; }
  $("modal").classList.add("hide"); currentEdit = null;
  msg($("appMsg"), currentEdit?.id ? "Produit mis à jour." : "Produit ajouté.","ok");
  await loadAll();
}
async function deleteProduct(id){
  if (!confirm("Supprimer définitivement ce produit ?")) return;
  const { error } = await sb.from("products").delete().eq("id", id);
  if (error){ msg($("modalMsg"), error.message, "err"); return; }
  $("modal").classList.add("hide"); currentEdit = null;
  msg($("appMsg"),"Produit supprimé.","ok");
  await loadAll();
}

/* ---------- BLOG ---------- */
function postForm(p={}){
  return `
    <div class="stack">
      <div><label>Titre *</label><input name="title" value="${escapeHtml(p.title||"")}" required></div>
      <div class="grid2">
        <div><label>Slug (auto si vide)</label><input name="slug" value="${escapeHtml(p.slug||"")}"></div>
        <div><label>Image de couverture (URL)</label><input name="featured_image" value="${escapeHtml(p.featured_image||"")}"></div>
      </div>
      <div><label>Extrait (résumé)</label><textarea name="excerpt" style="min-height:60px">${escapeHtml(p.excerpt||"")}</textarea></div>
      <div><label>Contenu (Markdown ou HTML)</label><textarea name="content" style="min-height:220px">${escapeHtml(p.content||"")}</textarea></div>
      <div class="grid2">
        <div><label>Meta title (SEO)</label><input name="meta_title" value="${escapeHtml(p.meta_title||"")}" maxlength="70"></div>
        <div><label>Meta description (SEO)</label><input name="meta_description" value="${escapeHtml(p.meta_description||"")}" maxlength="160"></div>
      </div>
      <div><label>Tags (séparés par virgules)</label><input name="tags" value="${escapeHtml((p.tags||[]).join(", "))}"></div>
      <div class="flex" style="margin-top:10px">
        <label style="margin:0;text-transform:none;color:var(--text);font-size:14px"><input type="checkbox" name="is_published" ${p.is_published?"checked":""} style="width:auto;margin-right:6px">Publié (visible sur le site)</label>
      </div>
    </div>`;
}
function renderBlog(){
  const q = $("searchBlog").value.trim().toLowerCase();
  const list = state.posts.filter(p => !q || (p.title||"").toLowerCase().includes(q) || (p.slug||"").toLowerCase().includes(q));
  $("counterBlog").textContent = `${list.length} / ${state.posts.length} articles`;
  $("rowsBlog").innerHTML = list.map(p=>`
    <tr data-id="${p.id}">
      <td><div class="name">${escapeHtml(p.title||"")}</div></td>
      <td class="mono cat">${escapeHtml(p.slug||"")}</td>
      <td class="center"><span class="dot ${p.is_published?"on":"off"}"></span>${p.is_published?"Oui":"Non"}</td>
      <td class="right cat">${p.published_at?new Date(p.published_at).toLocaleDateString("fr-FR"):""}</td>
      <td class="right"><button class="edit sm ghost">Éditer</button></td>
    </tr>
  `).join("");
  $("rowsBlog").querySelectorAll(".edit").forEach((btn,i)=>{
    btn.addEventListener("click", ()=>editPost(list[i].id));
  });
}
$("searchBlog").addEventListener("input", renderBlog);
$("btnNewPost").addEventListener("click", ()=>{
  currentEdit = { kind:"post", id:null };
  openModal("Nouvel article", postForm({is_published:false}), savePost);
});
function editPost(id){
  const p = state.posts.find(x=>x.id===id); if(!p) return;
  currentEdit = { kind:"post", id };
  openModal(`Modifier : ${p.title}`, postForm(p), savePost, ()=>deletePost(id));
}
async function savePost(){
  const f = readForm("post");
  if (!f.title){ msg($("modalMsg"),"Le titre est requis.","err"); return; }
  $("modalSave").disabled = true; $("modalSave").textContent = "…";
  let res;
  if (currentEdit.id){
    res = await sb.from("blog_posts").update(f).eq("id", currentEdit.id).select();
  } else {
    res = await sb.from("blog_posts").insert(f).select();
  }
  $("modalSave").disabled = false; $("modalSave").textContent = "Enregistrer";
  if (res.error){ msg($("modalMsg"), res.error.message, "err"); return; }
  const wasEdit = !!currentEdit.id;
  $("modal").classList.add("hide"); currentEdit = null;
  msg($("appMsg"), wasEdit ? "Article mis à jour." : "Article créé.","ok");
  await loadAll();
}
async function deletePost(id){
  if (!confirm("Supprimer définitivement cet article ?")) return;
  const { error } = await sb.from("blog_posts").delete().eq("id", id);
  if (error){ msg($("modalMsg"), error.message, "err"); return; }
  $("modal").classList.add("hide"); currentEdit = null;
  msg($("appMsg"),"Article supprimé.","ok");
  await loadAll();
}

/* ---------- CATEGORIES ---------- */
function catForm(c={}){
  return `
    <div class="stack">
      <div><label>Nom *</label><input name="name" value="${escapeHtml(c.name||"")}" required></div>
      <div><label>Slug (auto si vide)</label><input name="slug" value="${escapeHtml(c.slug||"")}"></div>
      <div><label>Description</label><textarea name="description" style="min-height:80px">${escapeHtml(c.description||"")}</textarea></div>
    </div>`;
}
function renderCategories(){
  $("counterCat").textContent = `${state.categories.length} catégories`;
  $("rowsCat").innerHTML = state.categories.map(c=>`
    <tr data-id="${c.id}">
      <td class="name">${escapeHtml(c.name||"")}</td>
      <td class="mono cat">${escapeHtml(c.slug||"")}</td>
      <td class="right"><button class="edit sm ghost">Éditer</button></td>
    </tr>`).join("");
  $("rowsCat").querySelectorAll(".edit").forEach((btn,i)=>{
    btn.addEventListener("click", ()=>editCat(state.categories[i].id));
  });
}
$("btnNewCat").addEventListener("click", ()=>{
  currentEdit = { kind:"cat", id:null };
  openModal("Nouvelle catégorie", catForm(), saveCat);
});
function editCat(id){
  const c = state.categories.find(x=>x.id===id); if(!c) return;
  currentEdit = { kind:"cat", id };
  openModal(`Modifier : ${c.name}`, catForm(c), saveCat);
}
async function saveCat(){
  const f = {};
  $("modalBody").querySelectorAll("input,textarea").forEach(el=>{ if(el.name) f[el.name] = el.value; });
  if (!f.name){ msg($("modalMsg"),"Le nom est requis.","err"); return; }
  if (!f.slug) f.slug = slugify(f.name);
  $("modalSave").disabled = true;
  let res = currentEdit.id
    ? await sb.from("categories").update(f).eq("id", currentEdit.id).select()
    : await sb.from("categories").insert(f).select();
  $("modalSave").disabled = false;
  if (res.error){ msg($("modalMsg"), res.error.message, "err"); return; }
  $("modal").classList.add("hide"); currentEdit = null;
  msg($("appMsg"),"Catégorie enregistrée.","ok");
  await loadAll();
}

loadSession();
</script>
</body>
</html>
